# The configured root is a durable parent. Every click allocates one unique
# child directory and registers it as an independent Workspace. Adopted
# directories remain so historical Sessions keep a valid cwd.
- insert:
    - id: temporary-workspace
      name: dsh-temporary-workspace
      config:
        root: !!js dshHomePath('temporary-workspaces')
        reservationRetentionMs: 3600000
