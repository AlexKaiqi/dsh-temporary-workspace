# The scratch root is durable on purpose: removing a successful Session's
# directory would break history replay and later resume. Each click gets its
# own child directory; only the short-lived Workspace registration is removed.
#
# reservationRetentionMs bounds only the crash window: a reservation whose Host
# died before adoption still carries its pending marker and is reclaimed after
# this grace period. Adopted directories are unmarked and never reclaimed.
- insert:
    - id: temporary-session
      name: dsh-temporary-session
      config:
        root: !!js dshHomePath('temporary-sessions')
        reservationRetentionMs: 3600000
