# The scratch root is durable on purpose and is registered as one fixed
# Workspace. Every click creates a new Session in that Workspace, so temporary
# work stays under one sidebar group and historical cwd values remain valid.
#
# reservationRetentionMs now applies only to compatibility cleanup for
# per-Session reservations created by older plugin clients. Adopted legacy
# directories are unmarked and never reclaimed.
- insert:
    - id: temporary-session
      name: dsh-temporary-session
      config:
        root: !!js dshHomePath('temporary-sessions')
        reservationRetentionMs: 3600000
